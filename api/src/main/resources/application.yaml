server:
  port: 8086
  tomcat:
    basedir: D:/develop/git/text/qihang-oms/temp
  undertow:
    temp-dir: D:/develop/temp
    threads:
      io: 8
      worker: 256
    accesslog:
      dir: D:/develop/temp
spring:
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  application:
    name: qihang-oms
  data:
    # redis 配置
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      # 密码
      #    password: 123321
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qihang-oms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      min-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
qihangerp:
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: cn.qihangerp.module.sys.domain;cn.qihangerp.domain;
